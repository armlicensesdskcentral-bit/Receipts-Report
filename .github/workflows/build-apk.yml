name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv
            - name: Build APK
        run: |
          buildozer -v android debug > build.log 2>&1 || { grep -n -i -E "error|exception|failed" build.log | grep -v -i -E "warning|Werror|Wno" | cut -c1-220 | tail -n 40; exit 1; }
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReceiptsReport-apk
          path: bin/*.apk
